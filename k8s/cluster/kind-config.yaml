# Kind cluster configuration for TrustMesh Zero-Trust local testbed
# Enables ServiceAccount token projection and admission registration
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: trustmesh-lab
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            service-account-issuer: https://kubernetes.default.svc.cluster.local
            service-account-key-file: /etc/kubernetes/pki/sa.pub
            service-account-signing-key-file: /etc/kubernetes/pki/sa.key
            api-audiences: https://kubernetes.default.svc.cluster.local,trustmesh-identity-verifier


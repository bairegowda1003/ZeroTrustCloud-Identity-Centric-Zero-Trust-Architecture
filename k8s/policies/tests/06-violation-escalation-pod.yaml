# Test Case 6: Violation - Privilege Escalation Enabled
# Violates: POL-ADM-04 (k8srestrictescalation / restrict-escalation)
# Fault Injection: container explicitly declares allowPrivilegeEscalation: true
#
# Expected Admission Decision: DENY (HTTP 403 Forbidden)
apiVersion: v1
kind: Pod
metadata:
  name: test-violation-escalation
  namespace: web
  labels:
    app: test-violation-escalation
    trustmesh.io/test-case: "negative-privilege-escalation"
spec:
  serviceAccountName: frontend-proxy-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
  containers:
    - name: setuid-binary-spawner
      image: alpine:3.19
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        allowPrivilegeEscalation: true  # PROHIBITED ESCALATION FLAG


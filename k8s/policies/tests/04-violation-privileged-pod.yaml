# Test Case 4: Violation - Privileged Container Request
# Violates: POL-ADM-02 (k8srestrictprivileged / restrict-privileged)
# Fault Injection: container explicitly requests privileged: true
#
# Expected Admission Decision: DENY (HTTP 403 Forbidden)
apiVersion: v1
kind: Pod
metadata:
  name: test-violation-privileged
  namespace: security
  labels:
    app: test-violation-privileged
    trustmesh.io/test-case: "negative-privileged-container"
spec:
  serviceAccountName: audit-collector-sa
  securityContext:
    runAsNonRoot: true
    runAsUser: 10005
  containers:
    - name: privileged-breakout-agent
      image: alpine:3.19
      command: ["sh", "-c", "sleep 3600"]
      securityContext:
        privileged: true  # EXPLICIT PRIVILEGED MODE REQUEST
        allowPrivilegeEscalation: false


apiVersion: constraints.gatekeeper.sh/v1beta1
kind: K8sRestrictPrivileged
metadata:
  name: restrict-privileged
  annotations:
    trustmesh.io/policy-id: "POL-ADM-02"
    trustmesh.io/enforcement-tier: "admission-blocking"
spec:
  enforcementAction: deny
  match:
    kinds:
      - apiGroups: [""]
        kinds: ["Pod"]
      - apiGroups: ["apps"]
        kinds: ["Deployment", "DaemonSet", "StatefulSet"]
      - apiGroups: ["batch"]
        kinds: ["Job", "CronJob"]
    excludedNamespaces:
      - kube-system
      - kube-public
      - kube-node-lease
      - gatekeeper-system


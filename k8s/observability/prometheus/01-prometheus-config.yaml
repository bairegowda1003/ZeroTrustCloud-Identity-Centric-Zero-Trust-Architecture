apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: observability
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s

    rule_files:
      - /etc/prometheus/rules/*.yaml

    scrape_configs:
      - job_name: 'otel-collector'
        static_configs:
          - targets: ['otel-collector.observability.svc.cluster.local:8889']

      - job_name: 'spire-server-metrics'
        static_configs:
          - targets: ['spire-server.spire-system.svc.cluster.local:8088']

      - job_name: 'gatekeeper-metrics'
        static_configs:
          - targets: ['gatekeeper-controller-manager.gatekeeper-system.svc.cluster.local:8888']


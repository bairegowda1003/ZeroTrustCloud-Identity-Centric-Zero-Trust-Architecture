apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-alerts
  namespace: observability
data:
  alerts.yaml: |
    groups:
      - name: zero-trust-security-alerts
        rules:
          - alert: UnsignedContainerImageAdmission
            expr: increase(gatekeeper_violations_total{constraint_kind="K8sCosignSignature"}[5m]) > 0
            for: 0m
            labels:
              severity: critical
              finding_ref: "TM-SEC-101"
            annotations:
              summary: "Unsigned container image rejected at admission webhook"
              description: "Workload attempted to deploy unsigned container violating Cosign signature policy."

          - alert: IstioPlaintextHandshakeDetected
            expr: increase(istio_tcp_connections_closed_total{response_flags="UF"}[5m]) > 0
            for: 0m
            labels:
              severity: critical
              finding_ref: "TM-SEC-103"
            annotations:
              summary: "Plaintext connection rejected under STRICT mTLS policy"
              description: "Non-mTLS client attempted connection to mesh workload and was reset."

          - alert: SpireAttestationFailure
            expr: increase(spire_agent_attestation_failure_total[5m]) > 0
            for: 0m
            labels:
              severity: high
              finding_ref: "TM-SEC-106"
            annotations:
              summary: "Workload failed SPIFFE kernel/cgroup attestation"
              description: "Unregistered or tampered binary failed SPIRE node agent attestation."


# TrustMesh Workload Registration Entries (SPIRE Server v1.9.5)
# Registers microservices with explicit Kubernetes selectors and short-lived SVID TTL (3600s).

# 1. Frontend Proxy Registration
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: frontend-proxy-identity
spec:
  spiffeIDTemplate: "spiffe://trustmesh.internal/ns/{{ .PodMeta.Namespace }}/sa/{{ .PodSpec.ServiceAccountName }}"
  podSelector:
    matchLabels:
      app: frontend-proxy
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: web
  ttl: "3600s"

---

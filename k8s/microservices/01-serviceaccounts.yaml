# Dedicated Zero-Trust ServiceAccounts
# Least-privilege principle: Every workload has its own identifiable ServiceAccount
apiVersion: v1
kind: ServiceAccount
metadata:
  name: frontend-proxy-sa
  namespace: web
  labels:
    app: frontend-proxy
    trustmesh.io/identity-tier: edge
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: order-api-sa
  namespace: orders
  labels:
    app: order-api
    trustmesh.io/identity-tier: app
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: payment-service-sa
  namespace: payments
  labels:
    app: payment-service
    trustmesh.io/identity-tier: financial
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: database-sa
  namespace: payments
  labels:
    app: database-cluster
    trustmesh.io/identity-tier: persistence
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: audit-collector-sa
  namespace: security
  labels:
    app: audit-collector
    trustmesh.io/identity-tier: audit
automountServiceAccountToken: false

